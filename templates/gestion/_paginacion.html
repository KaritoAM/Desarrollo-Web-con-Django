{% if page_obj.has_other_pages %}
<nav class="paginacion" aria-label="Paginación">
  {% if page_obj.has_previous %}<a href="?{% if query %}{{ query }}&{% endif %}page={{ page_obj.previous_page_number }}">Anterior</a>{% endif %}
  <span>Página {{ page_obj.number }} de {{ paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a href="?{% if query %}{{ query }}&{% endif %}page={{ page_obj.next_page_number }}">Siguiente</a>{% endif %}
</nav>
{% endif %}
